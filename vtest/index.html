<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Тест голосов: Велес / Волос</title>
<style>
body{margin:0;padding:16px;background:#14110f;color:#f1e8d8;font:18px/1.4 system-ui,sans-serif}
h1{font-size:22px;margin:0 0 6px}
p.t{color:#c9bca4;margin:0 0 18px;font-size:16px}
.v{background:#241e1a;border:1px solid #4a3f35;border-radius:14px;padding:14px;margin:0 0 14px}
.v b{display:block;font-size:24px;margin-bottom:2px}
.v span{display:block;color:#c9bca4;font-size:15px;margin-bottom:10px}
audio{width:100%;height:56px}
button{width:100%;font-size:22px;padding:16px;border:0;border-radius:12px;background:#c8913a;color:#1a120a;font-weight:700;margin-bottom:10px}
button.on{background:#e8b45a}
</style></head><body>
<h1>Выбери на слух</h1>
<p class="t">«Велес — скотий бог, он упомянут в договоре Святослава. О Велесе, Велесу, Велесом. Волос, Волоса.»<br>Слушай первую гласную: «Веле́с», «Воло́с».</p>
<div id="l"></div>
<script>
var V=[
["1","Edge Dmitry + ударение (как сейчас на сайте)"],
["2","Edge Svetlana + ударение"],
["3","Piper «Дмитрий», слова-цели с ручными фонемами (полное е/о в 1-м слоге)"],
["4","То же, но тон/темп подстроены под Dmitry (ffmpeg rubberband)"],
["5","Piper «Денис», ручные фонемы, тон опущен"],
["6","Edge Dmitry, основа слов Велес-/Волос- заменена на Piper «Дмитрий» (кроссфейд 15 мс)"],
["7","Edge Dmitry, основа слов заменена на Piper «Денис»"],
["8","Edge Dmitry, основа слов вырезана из прежних записей сайта (F1 ≥ 420, ударение на 2-м слоге)"]];
var l=document.getElementById('l'),cur=null;
V.forEach(function(v){var d=document.createElement('div');d.className='v';
d.innerHTML='<b>Вариант '+v[0]+'</b><span>'+v[1]+'</span><button>▶ Слушать</button><audio controls preload="none" src="'+v[0]+'.mp3"></audio>';
var a=d.querySelector('audio'),b=d.querySelector('button');
b.onclick=function(){if(a.paused){a.currentTime=0;a.play()}else a.pause()};
a.onplay=function(){if(cur&&cur!==a)cur.pause();cur=a;b.className='on';b.textContent='❚❚ Пауза'};
a.onpause=a.onended=function(){b.className='';b.textContent='▶ Слушать'};
l.appendChild(d)});
</script></body></html>
