name: Publish site

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Turn on GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh api "/repos/${GITHUB_REPOSITORY}/pages" >/dev/null 2>&1; then
            gh api --method POST "/repos/${GITHUB_REPOSITORY}/pages" -f build_type=workflow
          fi

      - name: Prepare site
        run: |
          mkdir -p _site
          cp index.html .nojekyll _site/
          cp -a img audio _site/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
